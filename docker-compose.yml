  backend:
    build: ./backend
    # depends_on:
    #   db:
    #     condition: service_healthy
    environment:
      PORT: 4000
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:5173
      DATABASE_URL: ${DATABASE_URL}
      # Estos valores son SOLO para levantar el stack local con un comando.
      # NUNCA los reutilices tal cual en Railway/producción — es exactamente
      # lo que pasó antes (la clave de cifrado y la de sync de acá terminaron
      # siendo también las de producción, porque alguien las copió de este
      # archivo). En producción, generá valores propios y random para cada una.
      JWT_SECRET: cambia-esto-por-un-secreto-largo-y-aleatorio-1234567890
      JWT_ACCESS_EXPIRES: 8h
      REFRESH_TTL_DIAS: 30
      REFRESH_TTL_RECORDAR_DIAS: 90
      SYNC_API_KEY: clave-larga-para-el-endpoint-de-replicacion-000
      # Email transaccional (Resend): cargado desde el .env de la raíz (gitignored).
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: Moratrans <onboarding@resend.dev>
      APP_URL: http://localhost:5173
      # Comprobantes/facturas/tickets (Supabase Storage): cargado desde el .env
      # de la raíz (gitignored) — necesita un bucket real, no hay mock local.
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET}
      # Cifrado en reposo: clave de uso EXCLUSIVAMENTE local (distinta de la de
      # producción a propósito).
      ENCRYPTION_KEY: 8a65aa9783f651269337381d166a25c387bed080866a55be29db09a782db4fbf
      # WhatsApp: credenciales reales, cargadas desde el .env de la raíz (gitignored).
      # docker compose lee automáticamente ./.env para resolver estas ${VAR}.
      WA_GRAPH_VERSION: v21.0
      WA_PHONE_NUMBER_ID: ${WA_PHONE_NUMBER_ID}
      WA_ACCESS_TOKEN: ${WA_ACCESS_TOKEN}
      WA_VERIFY_TOKEN: ${WA_VERIFY_TOKEN}
      WA_APP_SECRET: ${WA_APP_SECRET}
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4000
    depends_on:
      - backend
    ports:
      - "5173:5173"

