# ============================================================
#  LEVANTA TODO CON UN SOLO COMANDO:   docker compose up -d --build
#  - db        : PostgreSQL ya inicializado (schema + seed)
#  - backend   : API + webhook + Socket.io + cron   -> http://localhost:4000
#  - frontend  : panel de administración            -> http://localhost:5173
#  - adminer   : ver la base de datos               -> http://localhost:8080
#
#  Login del panel:  admin@empresa.com  /  Admin1234!
#  Reset total (borra datos):  docker compose down -v && docker compose up -d --build
# ============================================================
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: logistica
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./backend/src/db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d logistica"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:5173
      DATABASE_URL: postgres://postgres:postgres@db:5432/logistica
      JWT_SECRET: cambia-esto-por-un-secreto-largo-y-aleatorio-1234567890
      JWT_EXPIRES: 8h
      SYNC_API_KEY: clave-larga-para-el-endpoint-de-replicacion-000
      MEDIA_DIR: ./storage
      # Cifrado en reposo (cambiar en producción)
      ENCRYPTION_KEY: c76d0232d1933d7a830df01c26c33ccc675d2c23dce5cb9e8b9cd08295c051c1
      # WhatsApp: placeholders para desarrollo local (el bot no enviará mensajes reales)
      WA_GRAPH_VERSION: v21.0
      WA_PHONE_NUMBER_ID: "000000000000000"
      WA_ACCESS_TOKEN: mock
      WA_VERIFY_TOKEN: dev-verify
      WA_APP_SECRET: ""
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4000
    depends_on:
      - backend
    ports:
      - "5173:5173"

  adminer:
    image: adminer:4
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  pgdata:
